<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CommonPlace · Numbers</title>
<link rel="icon" href="/art/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0D0C0B; --surface: #141311; --ink: #EEE9E0; --ink-2: #B3ADA3; --ink-3: #85807A; --line: rgba(238, 233, 224, 0.1); --accent: #E3835C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 "Instrument Sans", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 1040px; margin: 0 auto; padding: 56px 24px 80px; }
  h1 { margin: 0 0 6px; font: 340 44px/1.05 "Newsreader", Georgia, serif; letter-spacing: -0.025em; }
  h1 em { font-style: italic; }
  .sub { color: var(--ink-3); font-size: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 40px 0 48px; }
  .tile { padding: 20px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
  .tile .label { font-size: 13px; color: var(--ink-2); }
  .tile .value { margin-top: 10px; font: 340 44px/1 "Newsreader", Georgia, serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .tile .note { margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
  section { margin-top: 40px; }
  h2 { margin: 0 0 16px; font: 400 22px/1.2 "Newsreader", Georgia, serif; }
  .chart { position: relative; padding: 20px 20px 12px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
  .chart svg { display: block; width: 100%; height: 180px; overflow: visible; }
  .chart .axis { font-size: 11.5px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .bar { fill: var(--accent); }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover + .bar, .chart .bar.on { fill: #F2A27F; }
  .tip { position: absolute; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: #26231F; box-shadow: 0 0 0 1px var(--line), 0 8px 20px rgba(0,0,0,.4); font-size: 12.5px; white-space: nowrap; opacity: 0; transition: opacity .12s; }
  .tip b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  ol { margin: 0; padding: 0; list-style: none; }
  ol li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  ol li span:last-child { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .empty { color: var(--ink-3); font-size: 14px; padding: 10px 0; }
  details { margin-top: 12px; color: var(--ink-2); font-size: 13px; }
  details table { width: 100%; margin-top: 10px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  details th, details td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  details th:first-child, details td:first-child { text-align: left; }
  .message { margin-top: 48px; padding: 24px; border-radius: 16px; background: var(--surface); color: var(--ink-2); }
  @media (max-width: 760px) { .tiles { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>CommonPlace, <em>in numbers.</em></h1>
  <p class="sub" id="sub">Counts only: no cookies, no IP addresses, never what anyone kept.</p>
  <div id="out"></div>
</main>
<script>
(async () => {
  const out = document.getElementById("out");
  const token = decodeURIComponent(location.hash.slice(1));
  const say = (text) => { out.innerHTML = `<p class="message">${text}</p>`; };
  if (!token) return say("Open this page with its key after the # in the address.");
  let data;
  try {
    const response = await fetch("/api/stats", { headers: { Authorization: `Bearer ${token}` } });
    if (response.status === 401) return say("That key isn’t right.");
    if (!response.ok) return say("The counters aren’t reachable yet. Is the Upstash store connected?");
    data = await response.json();
  } catch { return say("Couldn’t reach the counters."); }

  const n = (v) => Number(v).toLocaleString("en");
  const dayLabel = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en", { day: "numeric", month: "short", timeZone: "UTC" });
  const today = data.days.at(-1);
  const sum = (key) => data.days.reduce((s, d) => s + d[key], 0);

  const tile = (label, value, note) => `<div class="tile"><div class="label">${label}</div><div class="value">${n(value)}</div><div class="note">${note}</div></div>`;
  const tiles = `<div class="tiles">
    ${tile("Downloads", data.totals.downloads, `${n(today.downloads)} today · ${n(sum("downloads"))} in 30 days`)}
    ${tile("Macs using it", data.totals.installs, "ever checked in")}
    ${tile("Active this month", data.totals.monthlyActive, `${n(today.active)} today`)}
    ${tile("Things kept", data.totals.kept, `${n(today.kept)} today`)}
  </div>`;

  // One series per chart, one axis, bars from a zero baseline, a tooltip per bar.
  const chart = (key, title) => {
    const values = data.days.map((d) => d[key]);
    const max = Math.max(1, ...values);
    const step = max <= 4 ? 1 : Math.ceil(max / 4);
    const top = step * Math.ceil(max / step);
    const W = 1000, H = 180, left = 34, bottom = 22, plotH = H - bottom - 6, gap = 4;
    const bw = (W - left) / values.length;
    let grid = "";
    for (let v = 0; v <= top; v += step) {
      const y = 6 + plotH - (v / top) * plotH;
      grid += `<line class="grid" x1="${left}" x2="${W}" y1="${y}" y2="${y}"/><text class="axis" x="${left - 8}" y="${y + 4}" text-anchor="end">${n(v)}</text>`;
    }
    let bars = "";
    values.forEach((v, i) => {
      const h = (v / top) * plotH;
      const x = left + i * bw + gap / 2;
      const y = 6 + plotH - h;
      const r = Math.min(4, h / 2, (bw - gap) / 2);
      const path = h <= 0 ? "" : `M${x} ${6 + plotH} V${y + r} Q${x} ${y} ${x + r} ${y} H${x + bw - gap - r} Q${x + bw - gap} ${y} ${x + bw - gap} ${y + r} V${6 + plotH} Z`;
      bars += `<rect class="hit" x="${left + i * bw}" y="0" width="${bw}" height="${H - bottom}" data-i="${i}"/><path class="bar" d="${path}" data-i="${i}"/>`;
    });
    const ticks = [0, 7, 14, 21, 29].map((i) => `<text class="axis" x="${left + i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${dayLabel(data.days[i].day)}</text>`).join("");
    const rows = data.days.slice().reverse().map((d) => `<tr><td>${dayLabel(d.day)}</td><td>${n(d[key])}</td></tr>`).join("");
    return `<section><h2>${title}</h2><div class="chart" data-key="${key}">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${title}, last 30 days">${grid}${bars}${ticks}</svg>
      <div class="tip"></div></div>
      <details><summary>As a table</summary><table><tr><th>Day</th><th>${title}</th></tr>${rows}</table></details></section>`;
  };

  const list = (title, entries, empty) => `<section><h2>${title}</h2>${entries.length
    ? `<ol>${entries.map(([k, v]) => `<li><span>${k}</span><span>${n(v)}</span></li>`).join("")}</ol>`
    : `<p class="empty">${empty}</p>`}</section>`;

  out.innerHTML = tiles + chart("downloads", "Downloads per day") + chart("active", "Macs active per day") + chart("views", "Page views per day")
    + `<div class="two">${list("Where visitors came from", data.referrers, "No outside referrers in 30 days yet.")}
       ${list("App versions today", Object.entries(data.appVersionsToday), "No check-ins today yet.")}</div>`;

  for (const box of out.querySelectorAll(".chart")) {
    const tip = box.querySelector(".tip");
    const key = box.dataset.key;
    box.querySelectorAll(".hit").forEach((hit) => {
      hit.addEventListener("mouseenter", () => {
        const i = Number(hit.dataset.i);
        box.querySelectorAll(".bar").forEach((b) => b.classList.toggle("on", Number(b.dataset.i) === i));
        tip.innerHTML = `${dayLabel(data.days[i].day)} · <b>${n(data.days[i][key])}</b>`;
        const a = hit.getBoundingClientRect(), c = box.getBoundingClientRect();
        tip.style.left = `${Math.min(Math.max(a.left - c.left + a.width / 2 - 50, 8), c.width - 120)}px`;
        tip.style.top = "8px";
        tip.style.opacity = 1;
      });
    });
    box.addEventListener("mouseleave", () => { tip.style.opacity = 0; box.querySelectorAll(".bar").forEach((b) => b.classList.remove("on")); });
  }
})();
</script>
</body>
</html>
